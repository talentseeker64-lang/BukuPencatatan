version: '3.7'

networks:
  procurement-net:
    name: procurement-net

services:
  ca.procurement.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.procurement.example.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-procurement
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - 7054:7054
      - 17054:17054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../crypto-material/fabric-ca/procurement:/etc/hyperledger/fabric-ca-server
    networks:
      - procurement-net

  ca.vendor.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.vendor.example.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-vendor
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - 8054:8054
      - 18054:18054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../crypto-material/fabric-ca/vendor:/etc/hyperledger/fabric-ca-server
    networks:
      - procurement-net
