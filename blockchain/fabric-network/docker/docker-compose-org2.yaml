version: '3.7'

networks:
  procurement-net:
    name: procurement-net

volumes:
  peer0.vendor.example.com:

services:
  peer0.vendor.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.vendor.example.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=procurement-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.vendor.example.com
      - CORE_PEER_ADDRESS=peer0.vendor.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.vendor.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.vendor.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.vendor.example.com:9051
      - CORE_PEER_LOCALMSPID=VendorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ../crypto-material/peerOrganizations/vendor.example.com/peers/peer0.vendor.example.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-material/peerOrganizations/vendor.example.com/peers/peer0.vendor.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.vendor.example.com:/var/hyperledger/production
    ports:
      - 9051:9051
      - 9444:9444
    networks:
      - procurement-net
