version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: procurement_ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: procurement_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_phase2_init.sql:/docker-entrypoint-initdb.d/001_phase2_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurement_ledger_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/procurement_ledger?schema=public
      JWT_SECRET: super_secure_dev_jwt_secret_key_32bytes_min
      JWT_REFRESH_SECRET: super_secure_dev_refresh_secret_key_32bytes_min
      BLOCKCHAIN_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
